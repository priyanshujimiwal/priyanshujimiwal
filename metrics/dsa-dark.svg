<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-labelledby="title desc">
<title id="title">LeetCode practice</title>
<desc id="desc">47 LeetCode problems solved: 25 easy, 22 medium, 0 hard.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
<clipPath id="cardclip"><rect width="840" height="210" rx="18"/></clipPath>

</defs>
<style>
  .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace; }
  .fade { animation: fade .6s ease both; }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(6px) } to { transform: none } }
  
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion-only { display: none; }
  }
</style>
<rect x=".5" y=".5" width="839" height="209" rx="18" fill="#11141d" stroke="#ffffff14"/>
<g clip-path="url(#cardclip)">

  <text x="24" y="38" class="mono" font-size="11" fill="#8a90a6" letter-spacing="1.2" text-anchor="start">◆ DSA PRACTICE · LEETCODE</text>
  <text x="816" y="38" class="mono" font-size="10.5" fill="#8a90a6" text-anchor="end">auto-synced via LeetHub</text>
  <circle cx="92" cy="118" r="50" fill="none" stroke="#ffffff0d" stroke-width="9"/>
  <circle cx="92" cy="118" r="50" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="164.11 314.16" stroke-dashoffset="0" transform="rotate(-90 92 118)"
      class="fade" style="animation-delay:0.2s"/>
<circle cx="92" cy="118" r="50" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="144.05 314.16" stroke-dashoffset="-167.11" transform="rotate(-90 92 118)"
      class="fade" style="animation-delay:0.35s"/>

  <text x="92" y="124" class="sans" font-size="30" font-weight="800" fill="url(#g)" text-anchor="middle">47</text>
  <text x="92" y="142" class="mono" font-size="10" fill="#8a90a6" text-anchor="middle">solved</text>
  <g class="rise" style="animation-delay:0.1s">
      <text x="190" y="80" class="sans" font-size="13" fill="#e8eaf2">Easy</text>
      <text x="380" y="80" class="mono" font-size="12" fill="#8a90a6" text-anchor="end">25</text>
      <rect x="190" y="88" width="190" height="6" rx="3" fill="#ffffff0d"/>
      <rect x="190" y="88" width="190" height="6" rx="3" fill="#34d399" class="grow" style="animation-delay:0.3s"/>
    </g>
<g class="rise" style="animation-delay:0.18s">
      <text x="190" y="120" class="sans" font-size="13" fill="#e8eaf2">Medium</text>
      <text x="380" y="120" class="mono" font-size="12" fill="#8a90a6" text-anchor="end">22</text>
      <rect x="190" y="128" width="190" height="6" rx="3" fill="#ffffff0d"/>
      <rect x="190" y="128" width="167.2" height="6" rx="3" fill="#fbbf24" class="grow" style="animation-delay:0.4s"/>
    </g>
<g class="rise" style="animation-delay:0.26s">
      <text x="190" y="160" class="sans" font-size="13" fill="#e8eaf2">Hard</text>
      <text x="380" y="160" class="mono" font-size="12" fill="#8a90a6" text-anchor="end">0</text>
      <rect x="190" y="168" width="190" height="6" rx="3" fill="#ffffff0d"/>
      <rect x="190" y="168" width="0" height="6" rx="3" fill="#fb7185" class="grow" style="animation-delay:0.5s"/>
    </g>
  <line x1="406" y1="58" x2="406" y2="180" stroke="#ffffff14"/>
  <text x="430" y="58" class="mono" font-size="10.5" fill="#8a90a6">top topics</text>
  <g class="rise" style="animation-delay:0.15s">
      <text x="430" y="81" class="sans" font-size="12.5" fill="#e8eaf2">Array</text>
      <rect x="560" y="72" width="236" height="12" rx="6" fill="url(#g)" opacity="1" class="grow"/>
      <text x="804" y="82" class="mono" font-size="11" fill="#8a90a6">28</text>
    </g>
<g class="rise" style="animation-delay:0.21s">
      <text x="430" y="106" class="sans" font-size="12.5" fill="#e8eaf2">Two Pointers</text>
      <rect x="560" y="97" width="92.71" height="12" rx="6" fill="url(#g)" opacity="0.87" class="grow"/>
      <text x="660.71" y="107" class="mono" font-size="11" fill="#8a90a6">11</text>
    </g>
<g class="rise" style="animation-delay:0.27s">
      <text x="430" y="131" class="sans" font-size="12.5" fill="#e8eaf2">Binary Search</text>
      <rect x="560" y="122" width="67.43" height="12" rx="6" fill="url(#g)" opacity="0.74" class="grow"/>
      <text x="635.4300000000001" y="132" class="mono" font-size="11" fill="#8a90a6">8</text>
    </g>
<g class="rise" style="animation-delay:0.32999999999999996s">
      <text x="430" y="156" class="sans" font-size="12.5" fill="#e8eaf2">Hash Table</text>
      <rect x="560" y="147" width="59" height="12" rx="6" fill="url(#g)" opacity="0.61" class="grow"/>
      <text x="627" y="157" class="mono" font-size="11" fill="#8a90a6">7</text>
    </g>
<g class="rise" style="animation-delay:0.39s">
      <text x="430" y="181" class="sans" font-size="12.5" fill="#e8eaf2">Linked List</text>
      <rect x="560" y="172" width="59" height="12" rx="6" fill="url(#g)" opacity="0.48" class="grow"/>
      <text x="627" y="182" class="mono" font-size="11" fill="#8a90a6">7</text>
    </g>
</g>
</svg>
