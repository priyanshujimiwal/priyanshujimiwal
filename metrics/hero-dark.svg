<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
<title id="title">Priyanshu Jimiwal — MCA in AI &amp; Data Science</title>
<desc id="desc">MCA in AI &amp; Data Science at Graphic Era Hill University, 62% through the degree. open to SDE / internship roles.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
<clipPath id="cardclip"><rect width="840" height="260" rx="18"/></clipPath>

  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8eaf2" opacity=".07"/></pattern>
</defs>
<style>
  .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace; }
  .fade { animation: fade .6s ease both; }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(6px) } to { transform: none } }
  
  .blob { transform-box: fill-box; transform-origin: center; animation: drift 14s ease-in-out infinite alternate; }
  .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  .b3 { animation-duration: 11s; }
  @keyframes drift { from { transform: translate(0,0) scale(1) } to { transform: translate(40px,18px) scale(1.12) } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: .9 } to { transform: scale(2.6); opacity: 0 } }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) .3s both; }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes type { from { transform: translateX(0) } to { transform: translateX(var(--w)) } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion-only { display: none; }
  }
</style>
<rect x=".5" y=".5" width="839" height="259" rx="18" fill="#11141d" stroke="#ffffff14"/>
<g clip-path="url(#cardclip)">

  <circle class="blob b1" cx="110" cy="30" r="130" fill="#a78bfa" opacity="0.32" filter="url(#blur)"/>
  <circle class="blob b2" cx="420" cy="250" r="120" fill="#22d3ee" opacity="0.256" filter="url(#blur)"/>
  <circle class="blob b3" cx="760" cy="40" r="90" fill="#f472b6" opacity="0.192" filter="url(#blur)"/>
  <rect width="480" height="260" fill="url(#dots)"/>

  <g class="rise">
    <rect x="32" y="30" width="241.3" height="26" rx="13" fill="#4ade80" fill-opacity=".1" stroke="#4ade80" stroke-opacity=".35"/>
    <circle cx="48" cy="43" r="4" fill="#4ade80"/>
    <circle cx="48" cy="43" r="4" fill="none" stroke="#4ade80" class="pulse"/>
    <text x="60" y="47" class="mono" font-size="11" fill="#e8eaf2">open to SDE / internship roles</text>
  </g>

  <g class="rise" style="animation-delay:.05s">
    <text x="30" y="108" class="sans" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#g)">Priyanshu Jimiwal</text>
    <text x="32" y="138" class="sans" font-size="16" font-weight="600" fill="#e8eaf2">MCA in AI &amp; Data Science</text>
    <text x="32" y="160" class="sans" font-size="14" fill="#8a90a6">Graphic Era Hill University · 2025 – 2027</text>
  </g>

  <g class="rise" style="animation-delay:.1s">
    <text x="32" y="196" class="mono" font-size="11" fill="#8a90a6" letter-spacing="1.2" text-anchor="start">degree.progress</text>
    <text x="432" y="196" class="mono" font-size="11" fill="#e8eaf2" text-anchor="end">62%</text>
    <rect x="32" y="205" width="400" height="8" rx="4" fill="#ffffff0d" stroke="#ffffff14"/>
    <rect x="32" y="205" width="249.25" height="8" rx="4" fill="url(#g)" class="grow"/>
    <text x="32" y="236" class="mono" font-size="11" fill="#8a90a6">currently → <tspan fill="#e8eaf2">learning system design · grinding DSA</tspan></text>
  </g>
  
  <g class="rise" style="animation-delay:.15s">
    <rect x="500" y="24" width="316" height="212" rx="12" fill="#090b11" stroke="#ffffff14"/>
    <circle cx="518" cy="42" r="5" fill="#ff5f57"/>
    <circle cx="534" cy="42" r="5" fill="#febc2e"/>
    <circle cx="550" cy="42" r="5" fill="#28c840"/>
    <text x="658" y="46" class="mono" font-size="10.5" fill="#8a90a6" text-anchor="middle">~/pj — zsh</text>
    <line x1="500" y1="58" x2="816" y2="58" stroke="#ffffff10"/>
    <text x="518" y="82" class="mono" font-size="12" fill="#22d3ee">❯</text>
    <text x="534" y="82" class="mono" font-size="12" fill="#d6d9e6">whoami</text>
    <rect class="cover motion-only" x="532" y="69" width="47.92" height="17" fill="#090b11"
      style="--w:47.92px; animation: type 0.5s steps(6) 0.4s both"/>
    <text x="534" y="103" class="mono fade" font-size="12" fill="#8a90a6" style="animation-delay:1.05s">priyanshu · MCA (AI &amp; DS) student</text>
    <text x="518" y="130" class="mono" font-size="12" fill="#22d3ee">❯</text>
    <text x="534" y="130" class="mono" font-size="12" fill="#d6d9e6">cat focus.txt</text>
    <rect class="cover motion-only" x="532" y="117" width="99.16" height="17" fill="#090b11"
      style="--w:99.16px; animation: type 0.585s steps(13) 1.4s both"/>
    <text x="534" y="151" class="mono fade" font-size="12" fill="#8a90a6" style="animation-delay:2.135s">ML pipelines · DSA · Python</text>
    <text x="518" y="178" class="mono" font-size="12" fill="#22d3ee">❯</text>
    <text x="534" y="178" class="mono" font-size="12" fill="#d6d9e6">python forecast.py --fest diwali</text>
    <rect class="cover motion-only" x="532" y="165" width="238.24" height="17" fill="#090b11"
      style="--w:238.24px; animation: type 1.44s steps(32) 2.485s both"/>
    <text x="534" y="199" class="mono fade" font-size="12" fill="#4ade80" style="animation-delay:4.074999999999999s">✓ spike caught by festival regressor</text>
    <text x="518" y="226" class="mono fade" font-size="12" fill="#22d3ee" style="animation-delay:4.424999999999999s">❯</text>
    <rect x="534" y="215" width="7" height="14" fill="#d6d9e6" class="cursor"/>
  </g>
</g>
</svg>
